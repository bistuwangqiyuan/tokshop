# 24h unattended engine scheduler (Vercel Hobby cron allows only 2/day, so
# high-frequency scheduling runs on GitHub Actions; endpoints authenticate
# with CRON_SECRET). Migrated from the amd repository after its private-repo
# Actions were blocked by account billing; this repo is public (free minutes).
# Note: GitHub schedules are best-effort and can lag minutes at peak.
name: engine-scheduler

on:
  schedule:
    - cron: "*/30 * * * *" # trends tracking (every 30 min)
    - cron: "10 */2 * * *" # content generation (every 2 h)
    - cron: "40 3 * * *" # seo-audit / health / reconcile / backfill (daily)
  workflow_dispatch:
    inputs:
      task:
        description: "Task (trends/content/seo-audit/health/reconcile/backfill/all)"
        default: "all"

permissions: {}

concurrency:
  group: engine-scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://tokshop.xyz
      SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Decide tasks for this trigger
        id: plan
        run: |
          MINUTE=$(date -u +%M)
          HOUR=$(date -u +%H)
          EVENT="${{ github.event_name }}"
          INPUT_TASK="${{ github.event.inputs.task }}"
          TASKS=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$INPUT_TASK" = "all" ]; then
              TASKS="trends content seo-audit health reconcile backfill"
            else
              TASKS="$INPUT_TASK"
            fi
          else
            # classify by trigger time (GitHub does not say which cron fired)
            TASKS="trends"
            if [ "$MINUTE" -ge 05 ] && [ "$MINUTE" -lt 25 ] && [ $((10#$HOUR % 2)) -eq 0 ]; then
              TASKS="$TASKS content"
            fi
            if [ "$HOUR" = "03" ] && [ "$MINUTE" -ge 30 ]; then
              TASKS="$TASKS seo-audit health reconcile backfill"
            fi
          fi
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "will run: $TASKS"
      - name: Call engine endpoints
        run: |
          set -e
          FAIL=0
          for t in ${{ steps.plan.outputs.tasks }}; do
            echo "== $t =="
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $SECRET" \
              --max-time 300 "$BASE/api/engine/$t")
            echo "HTTP $CODE"
            cat /tmp/resp.json | head -c 800; echo ""
            if [ "$CODE" -ge 400 ]; then FAIL=1; fi
          done
          exit $FAIL
