gaps:
  - id: G-1
    item: 柔佛/曼谷/雅加达/马尼拉的 AI 级液冷托管实际牌价
    status: 全部为询价定价，无公开牌价
    impact: 各国托管成本只能用 CBRE 新加坡绝对值 × 相对比例推算，属估计非报价
    action: M1 选址门以 RFQ 取得可签署报价后替换
  - id: G-2
    item: 泰国、印尼、菲律宾的工商电价
    status: 未取得可引用来源
    impact: 这三国不做出租方成本反推，仅做租金与税负对比
    action: RFQ 时一并索取电价条款
  - id: G-3
    item: 马尼拉到新加坡及到美西的网络延迟
    status: 无数据
    impact: 菲律宾不纳入延迟量化排名
    action: 实测或向 IDC 索取
  - id: G-4
    item: 泰国、印尼、菲律宾是否有与马来西亚 MITI 指令对等的 AI 芯片许可制
    status: 未核实
    impact: 层三筛查对这三国留空，不得据此宣称其「无管制」
    action: 由当地律师出具意见
  - id: G-5
    item: 马来西亚实缴资本 ≤RM250 万公司的优惠税率档具体数值
    status: 来源表格截断
    impact: 马来西亚一律按 24% 标准税率计，偏保守
    action: 查证后可下调
  - id: G-6
    item: 延迟到 OpenRouter 路由流量份额的定量映射
    status: 无公开数据
    impact: 不构造需求弹性，只做 SLO 阈值通过与否的定性判断
    action: 上架后用自身流量实测
  - id: G-7
    item: 本项目租约的押金月数、租期、提前终止条款
    status: 未获合同文本
    impact: 尾部租约义务与下行风险的测算全部依赖假设
    action: 签约前必须确认，见 assumptions.lease_term_months
