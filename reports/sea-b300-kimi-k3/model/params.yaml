export_control:
  entity_rule:
    src: S-13
    date: "2026-05-31"
    citation: "EAR 742.6(a)(6)(iii)(A)"
    scope: all destinations outside the United States
    trigger: 实体总部或其最终母公司总部位于 Country Group D:5 或澳门
    eccn_covered: ["3A090.a", "3A090.b", "4A090.a", "4A090.b", ".z"]
    note: >
      BIS 2026-05-31 指引。此为实体属性管制，与物理目的地无关，更换东道国无法解除。
      存在 740.2(a)(9)(ii) 项下的许可例外。善意数据中心运营商对存量物项的持续使用、
      存储、处置、维护在 BIS 另行通知前无需停止。
