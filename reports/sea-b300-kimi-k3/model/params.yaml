# ---------------------------------------------------------------------------
# 二、B300 硬件规格（S-04）
# ---------------------------------------------------------------------------
hardware:
  hbm_bandwidth_tb_s:
    value: 8.0
    src: S-04
    note: 每 GPU。八卡聚合 64 TB/s。
  nvfp4_dense_pflops:
    value: 15.0
    src: S-04
