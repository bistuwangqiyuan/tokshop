    value: [8.8, 11.2]
    src: S-19
    note: 仅 8 卡基板，1100W 风冷档至 1400W 液冷档，不含 CPU 与网络。

# ---------------------------------------------------------------------------
# 三、产能实测锚点（S-06 / S-07）
# ---------------------------------------------------------------------------
capacity:
  decode_points:
    value:
      - [2000, 1759.0]      # S-06 Openzeka DGX-B300 TP8 vLLM 直出 c=64（未取 SGLang 1863，保守）
      - [65536, 501.0]      # S-07 GPUStack 64K/c=10 vLLM 稳态
      - [204800, 268.0]     # S-07 GPUStack 200K/c=10 SGLang+DCP8 稳态（vLLM 为 163）
    src: S-06,S-07
    note: 聚合解码输出 tok/s。三点分别来自两家独立实测，测试条件不同，见 C-5。
  prefill_tokens_per_sec:
    value: 16134.0
    src: S-07
    note: 由 GPUStack 两组端到端耗时反解，64K 组得 16134、200K 组得 18425，取较低者。
  prefill_engine_log_range:
    value: [19000, 23000]
    src: S-07
    note: GPUStack 引擎日志自报稳态聚合 prefill 吞吐。高于反解值，作为上界用于敏感性。
  kv_pool_tokens:
    value: 2687776
    src: S-07
    note: vLLM gpu-memory-utilization=0.95 时 KV 池容量。该配置已超额分配，安全值约 0.92。
  kv_gib_per_gpu:
    value: 43.76
    src: S-07
  cold_start_minutes_warm_disk:
    value: 10.6
    src: S-07
    note: 权重已在本地 NVMe，容器创建到就绪。用于计划外重启的 MTTR。
  cold_start_minutes_full:
    value: 88.8
    src: S-05
    note: 含约 81.4 分钟权重加载的完整冷启动。用于首次开机与迁移。见 C-6。
  spec_decode_breakeven_concurrency:
    value: 16
    src: S-06
    note: DSpark 投机解码在 c>16 后由增益转为拖累，生产高负载应关闭。

