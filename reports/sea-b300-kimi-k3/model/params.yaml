# ---------------------------------------------------------------------------
# 八、显式假设（无公开出处，全部纳入敏感性）
# ---------------------------------------------------------------------------
assumptions:
  deposit_months:
    value: 2.0
    note: 商务惯例，未获本项目合同文本证实。列为谈判必争项。
  opex_buffer_months:
    value: 3.0
    note: 运营现金缓冲。用户已确认「首月租金 + 3 个月安全垫」的初始资金口径。
  lease_term_months:
    value: 36
    note: >
      本项目未给定租期。但 ¥150,000/月 显著低于按需市场价，行业惯例上只有长约
      才能取得该价位，故基准取 36 个月，并对 12 与 1（月付无承诺）做敏感性。
      这一假设决定尾部租约义务的大小，是本模型最敏感的假设之一。
  early_termination_allowed:
    value: false
    note: 基准假设无提前终止权。若能谈到，下行风险大幅收窄。
  payment_fee_rate:
    value: 0.039
    note: 自建 API 侧支付通道费率，来自本仓 PAYMENTS_SETUP.md 的 Creem 记录商户费率。
  payment_fee_fixed_usd:
    value: 0.40
  avg_topup_usd:
    value: 20.0
  misc_opex_usd_per_month:
    value: 1200
    note: 监控、域名、对象存储、冗余上游等。按节点数线性计。
  compliance_opex_usd_per_year:
    value: 6000
    note: >
      新加坡主体年度合规约 S$7,000-8,000（约 US$5,500-6,200）。跨境增设算力地后
      另增东道国申报义务，此处仅计主体侧，东道国侧列为不确定性。
  aggregator_revenue_share:
    value: 0.60
    note: 双轨渠道中经聚合平台的收入占比。聚合平台无加价但账期长。
  ar_days_aggregator:
    value: 45
    note: OpenRouter 按月开票，假设账期 net-30，加上开票周期取 45 天。营运资金缺口来源。
  ar_days_direct:
    value: 0
    note: 自建 API 为预付额度，无应收。
  rent_paid_in_advance_months:
    value: 1.0
  price_erosion_annual:
    value: 0.20
    note: 依据 11 家同价竞争的市场结构定性推断，无历史序列可拟合。三档 0/20/40%。
  hazard_monthly:
    value: 0.010
    note: >
      月度中断危险率。合规东道国下低于前序报告的境内灰色渠道情景（1.5%），
      但仍需覆盖监管突变、供应链与单点故障。三档 0.5/1.0/2.0%。
  supply_cap_new_nodes_per_quarter:
    value: 1
    note: B300 仍属配额供应；Bit Origin 需通过收购第三方采购单才拿到 16 台。
  provisioning_lag_months:
    value:
      MY: 2
      TH: 1
      ID: 1
      PH: 1
      SG: 1
    note: 马来西亚含 MITI 提前 30 天申报。均为估计值。
  demand_scenarios:
    pessimistic: {month_to_first_node_full: 60.0, plateau_nodes: 0.35}
    neutral: {month_to_first_node_full: 24.0, plateau_nodes: 1.0}
    optimistic: {month_to_first_node_full: 10.0, plateau_nodes: 3.0, growth_after_plateau: 0.02}
    note: 与前序报告同口径，便于两份报告横向对照。取决于获客能力，非外部事实。
  discount_rate_annual:
    value: 0.12
    note: 用于尾部租约义务折现。取新兴市场算力资产融资成本量级。
  lessor_cost_model:
    amortization_months: 36
    financing_rate_annual: 0.12
    contracted_kw: 15.0
    avg_load_factor: 0.85
    pue: 1.25
    network_usd_per_month: 1000
    note: >
      出租方成本反推的假设集。摊销 36 个月对应 AI 加速器的实际经济寿命（3 年后
      被新一代替代），比会计上常用的 5 年更贴近现实。合约功率取整机上限 14.5kW
      上浮至 15kW；平均负载因子 85% 反映推理工况下 GPU 接近 TDP 运行。
      PUE 1.25 为直接液冷的典型值。这些都是假设，用于判断报价是否可持续，
      不用于测算我方成本（我方成本就是合同租金本身）。

