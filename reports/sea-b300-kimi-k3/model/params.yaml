#
# 规则
# ----
# 1. 凡本文件未登记的数字，一律不得作为报告结论的依据。
# 2. 每个 fact 必带 src（可回溯到 ../02-数据来源与核验附录.md 的 S-xx 编号）与 date。
# 3. assumption 段的参数无公开出处，必须显式标为假设，并纳入敏感性分析。
# 4. gap 段登记「查不到」的数据，报告中不得用估值冒充事实。
#
# 统一取数日期：2026-08-05（UTC+8），个别条目另注。

